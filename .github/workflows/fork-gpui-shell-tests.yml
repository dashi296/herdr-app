# Fork-only: runs gpui-shell's syntax tests, which the root workspace's CI does not run
# (vendor/gpui-kit is excluded from the root workspace). Not part of the upstream PR.
name: fork-gpui-shell-tests
on:
  pull_request:
permissions:
  contents: read
jobs:
  syntax-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.95.0
      - name: Linux build dependencies
        run: |
          scripts/ci-apt \
            pkg-config clang libclang-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev mesa-vulkan-drivers libfontconfig-dev libfreetype-dev
      - name: gpui-shell syntax tests
        working-directory: vendor/gpui-kit
        run: cargo test -p gpui-shell --config 'profile.dev.package."*".opt-level=0' syntax:: -- --nocapture
